<!doctype html>
<!--
  Prototipo de RF-NNN — <Título del requerimiento>
  Parte de wireframe/index.html: mismas pantallas, estados, data-id y clases.
  Plantilla con un ejemplo (registro de usuarios): reemplázalo por el wireframe aprobado.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RF-NNN — Prototipo</title>
  <link rel="stylesheet" href="../../design/tokens.css">
  <link rel="stylesheet" href="../../design/components.css">
  <script defer src="../../design/proto.js"></script>
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body data-rf="RF-NNN" data-fase="prototipo">
  <main id="app">

    <section data-screen="P1" data-title="Crear cuenta"
             data-states="inicial cargando error-validacion error-sistema">
      <div class="page">
        <form class="card stack" id="form-registro" data-id="P1.formulario" novalidate>
          <div class="stack center" data-id="P1.encabezado">
            <h1 class="title">Crea tu cuenta</h1>
            <p class="subtitle">Empieza en menos de un minuto.</p>
          </div>

          <div class="alert alert-error" role="alert" data-id="P1.error-sistema" data-show-in="error-sistema">
            No pudimos crear tu cuenta. Inténtalo de nuevo en unos minutos.
          </div>

          <div class="field" data-id="P1.nombre">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" autocomplete="name" aria-describedby="nombre-error">
            <span class="field-error" id="nombre-error"></span>
          </div>

          <div class="field" data-id="P1.correo">
            <label for="correo">Correo electrónico</label>
            <input id="correo" name="correo" type="email" autocomplete="email"
                   aria-describedby="correo-error">
            <span class="field-error" id="correo-error"></span>
          </div>

          <div class="field" data-id="P1.clave">
            <label for="clave">Contraseña</label>
            <input id="clave" name="clave" type="password" autocomplete="new-password"
                   aria-describedby="clave-ayuda clave-error">
            <span class="muted" id="clave-ayuda">Mínimo 8 caracteres.</span>
            <span class="field-error" id="clave-error"></span>
          </div>

          <button class="btn btn-primary btn-block" type="submit" data-id="P1.crear-cuenta">
            <span class="spinner" data-show-in="cargando" aria-hidden="true"></span>
            Crear cuenta
          </button>

          <p class="muted center" data-id="P1.ir-a-login">¿Ya tienes cuenta? <a href="#">Inicia sesión</a></p>
        </form>
      </div>
    </section>

    <section data-screen="P2" data-title="Cuenta creada" data-states="exito">
      <div class="page">
        <div class="card stack center" data-id="P2.confirmacion">
          <h1 class="title">¡Listo!</h1>
          <p class="subtitle">
            Enviamos un enlace de confirmación a <strong data-bind="correo"></strong>.
          </p>
          <a class="btn btn-secondary" data-id="P2.volver" href="#P1">Volver al inicio</a>
        </div>
      </div>
    </section>

  </main>
</body>
</html>
